<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vio Vacations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Keep your fonts and style tags here -->
</head>
<body class="bg-[#fafafa] font-sans text-gray-800">

  <!-- Header (Your existing header code) -->
  
  <!-- Hero Section -->
  <section class="relative h-[600px] overflow-hidden">
     <!-- Slideshow content -->
  </section>

  <!-- About Section -->
  <section class="py-16 px-6 bg-white">
     <!-- About content -->
  </section>

  <!-- Availability Form -->
  <form id="check-availability" class="relative z-20 max-w-lg mx-auto -mt-10 bg-white/90 p-4 rounded-xl shadow-xl flex gap-4">
     <!-- Inputs -->
  </form>

  <!-- Featured Collections -->
  <main class="pt-24 pb-32 px-6 max-w-7xl mx-auto">
    <h2 class="text-5xl font-serif text-center mb-16">Featured Collections</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <!-- Trigger for Tenkiller -->
      <button onclick="openGallery('tenkiller')" class="group relative h-80 rounded-2xl overflow-hidden shadow-lg text-left w-full">
        <img src="images/silo/silo-1.jpg" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 p-8 flex flex-col justify-end text-white">
          <h3 class="text-3xl font-serif">Lake Tenkiller Retreats</h3>
        </div>
      </button>

      <!-- Trigger for Hilltop -->
      <button onclick="openGallery('hilltop')" class="group relative h-80 rounded-2xl overflow-hidden shadow-lg text-left w-full">
        <img src="images/hilltopHB/hilltop-1.jpg" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 p-8 flex flex-col justify-end text-white">
          <h3 class="text-3xl font-serif">The Luxury Hilltop HB</h3>
        </div>
      </button>
    </div>
  </main>

  <!-- The Modal (Placed at bottom, outside all other sections) -->
  <div id="modal" class="fixed inset-0 z-[100] hidden bg-black/95 flex items-center justify-center">
    <button onclick="closeModal()" class="absolute top-5 right-5 text-white text-5xl z-[101]">&times;</button>
    <div class="relative w-full max-w-4xl h-3/4 flex items-center">
      <img id="modal-img" src="" class="max-h-full mx-auto object-contain">
    </div>
  </div>

  <script>
    // Gallery Data
    const galleries = {
      tenkiller: ['images/silo/silo-1.jpg', 'images/silo/silo-2.jpg'], // Add your paths here
      hilltop: ['images/hilltopHB/hilltop-1.jpg', 'images/hilltopHB/hilltop-2.jpg']
    };

    let currentGallery = [];
    let currentIndex = 0;

    function openGallery(type) {
      currentGallery = galleries[type];
      currentIndex = 0;
      document.getElementById('modal-img').src = currentGallery[currentIndex];
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }
  </script>
</body>
</html>
