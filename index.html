<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Vio Vacations</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    .font-serif { font-family: 'Playfair Display', serif; }
    .font-sans { font-family: 'Inter', sans-serif; }
    .slideshow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    opacity: 0;
    /* 15 seconds total duration */
    animation: fade 15s infinite;
   }

  /* Each image takes 3 seconds (15 / 5 = 3) */
  .slide:nth-child(1) { animation-delay: 0s; }
  .slide:nth-child(2) { animation-delay: 3s; }
  .slide:nth-child(3) { animation-delay: 6s; }
  .slide:nth-child(4) { animation-delay: 9s; }
  .slide:nth-child(5) { animation-delay: 12s; }

  @keyframes fade {
    /* Image stays hidden at the start */
    0% { opacity: 0; }
    /* Fade in quickly (takes 10% of total time) */
    10% { opacity: 1; }
    /* Stay visible (takes 30% of total time) */
    40% { opacity: 1; }
    /* Fade out (takes 10% of total time) */
    50% { opacity: 0; }
    /* Stay hidden until the cycle repeats */
    100% { opacity: 0; }
  }
  </style>
</head>
<body class="bg-[#fafafa] font-sans text-gray-800">

 <header class="absolute w-full top-0 z-10 py-6 px-6 md:px-12 flex justify-between items-center bg-transparent">
  
    <button onclick="toggleMenu()" class="md:hidden text-white z-50">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
      </svg>
    </button>
  
    <nav class="hidden md:flex space-x-8">
      <a class="text-white drop-shadow-md hover:text-gray-200 font-medium transition-colors" href="#">Destinations</a>
      <a class="text-white drop-shadow-md hover:text-gray-200 font-medium transition-colors" href="#">Experiences</a>
      <a class="text-white drop-shadow-md hover:text-gray-200 font-medium transition-colors" href="#">About</a>
    </nav>
  
    <div class="flex flex-col items-center">
      <img src="vio-vacations-logo.svg" alt="Vio Vacations Logo" class="w-24 h-auto drop-shadow-md">
      <span class="font-serif text-2xl md:text-3xl lg:text-4xl mt-2 tracking-wide text-white drop-shadow-md">
        Vio Vacations
      </span>
    </div>
  
    <div class="mt-2">
      <a class="inline-flex items-center px-6 py-2 border border-white rounded bg-white/20 hover:bg-white/40 transition-colors text-white backdrop-blur-sm" href="#">
        <span class="mr-2 font-medium tracking-wide text-sm">BOOK NOW</span>
      </a>
    </div>
  </header>
  <div id="mobile-menu" class="hidden fixed inset-0 z-50 bg-white/10 backdrop-blur-md flex flex-col items-center justify-center space-y-8">
  
    <button onclick="toggleMenu()" class="md:hidden text-white drop-shadow-md z-50">
      <!-- Hamburger Icon -->
      <svg id="menu-open-icon" class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
      </svg>
  
      <!-- X Icon (Hidden by default) -->
      <svg id="menu-close-icon" class="w-8 h-8 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
    
    <a class="text-white text-3xl font-serif hover:text-gray-600 transition-colors" href="#">Destinations</a>
    <a class="text-white text-3xl font-serif hover:text-gray-600 transition-colors" href="#">Experiences</a>
    <a class="text-white text-3xl font-serif hover:text-gray-600 transition-colors" href="#">About</a>
    <!--<a class="text-gray-900 text-3xl font-serif hover:text-gray-600 transition-colors" href="#">BOOK NOW</a>-->
  </div>
  <section class="relative h-[600px] overflow-hidden">
    <div class="slideshow">
      <div class="slide" style="background-image: url('images/property-1.jpg');"></div>
      <div class="slide" style="background-image: url('images/property-2.jpg');"></div>
      <div class="slide" style="background-image: url('images/property-3.jpg');"></div>
      <div class="slide" style="background-image: url('images/property-4.jpg');"></div>
      <div class="slide" style="background-image: url('images/property-5.jpeg');"></div>
    </div>
    <div class="absolute inset-0 bg-black/20 z-0"></div> 
  </section>

  <div class="relative z-20 max-w-5xl mx-auto -mt-10 bg-white/90 backdrop-blur-md p-4 rounded-xl shadow-xl flex flex-col md:flex-row gap-4">
    
    <div class="flex-1 relative">
      <select id="property-dropdown" class="w-full pl-4 pr-10 py-3 border border-gray-200 rounded-lg focus:ring-1 focus:ring-gray-400 focus:border-gray-400 bg-white font-sans text-gray-800 appearance-none cursor-pointer">
        <option value="" disabled selected>Destination</option>
        <option value="tenkiller.html">Lake Tenkiller Retreats</option>
        <option value="hilltop.html">The Luxury Hilltop HB</option>
      </select>
      <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </div>
    </div>
    
    <div class="flex-1 relative opacity-70">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </div>
      <input class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg bg-white font-sans text-gray-800 cursor-not-allowed" placeholder="Dates (Select property first)" type="text" disabled/>
    </div>

    <div class="flex-1 relative opacity-70">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </div>
      <input class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg bg-white font-sans text-gray-800 cursor-not-allowed" placeholder="Guests" type="text" disabled/>
    </div>

    <div>
      <button onclick="searchProperty()" class="px-8 py-3 bg-gray-100 hover:bg-gray-200 border border-gray-800 rounded-lg font-sans font-medium tracking-wide transition-colors whitespace-nowrap text-gray-800" type="button">
        CHECK AVAILABILITY
      </button>
    </div>
  </div>
    <main class="pt-24 pb-32 px-6 max-w-7xl mx-auto">
      <h2 class="text-5xl font-serif text-center mb-16 text-gray-900">Featured Collections</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <a class="group relative h-80 rounded-2xl overflow-hidden shadow-lg block" href="#">
        <img alt="Lake Tenkiller Retreats" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="https://images.unsplash.com/photo-1542718610-a1d656d1884c?q=80&w=2070&auto=format&fit=crop"/>
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-8 text-white">
          <h3 class="font-serif text-3xl mb-2">Lake Tenkiller Retreats</h3>
          <p class="text-gray-200 text-lg">Tranquil escapes in the heart of nature.</p>
        </div>
      </a>

      <a class="group relative h-80 rounded-2xl overflow-hidden shadow-lg block" href="#">
        <img alt="Lux Hilltop" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073&auto=format&fit=crop"/>
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-8 text-white">
          <h3 class="font-serif text-3xl mb-2">The Luxury Hilltop HB</h3>
          <p class="text-gray-200 text-lg">Exclusive stays on Horseshoe Bay.</p>
        </div>
      </a>
      
    </div>
  </main>
  <script>
    function searchProperty() {
      var dropdown = document.getElementById("property-dropdown");
      var selectedPage = dropdown.value;
      if (selectedPage) {
        window.location.href = selectedPage;
      } else {
        alert("Please select a destination from the dropdown first!");
      }
    }
    function toggleMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
      // Optional: Prevent background scrolling when menu is open
      document.body.style.overflow = menu.classList.contains('hidden') ? 'auto' : 'hidden';
    }
</script>
</body>
</html>
