<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vio Vacations</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-fonts">
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    .font-sans {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="font-sans antialiased text-gray-800 bg-gray-50">
<!-- BEGIN: Header -->
<header class="fixed w-full top-0 z-50 bg-white/90 backdrop-blur-sm border-b border-gray-100 transition-all duration-300">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex justify-between items-center h-20">
<!-- Navigation Links -->
<nav class="hidden md:flex space-x-8">
<a class="text-gray-700 hover:text-black transition-colors" href="#">Destinations</a>
<a class="text-gray-700 hover:text-black transition-colors" href="#">Experiences</a>
<a class="text-gray-700 hover:text-black transition-colors" href="#">About</a>
</nav>
<!-- Logo -->
<div class="flex-shrink-0 flex items-center justify-center flex-1 md:flex-none">
<a class="flex flex-col items-center" href="#"><i class="fa-solid fa-tree text-3xl mb-1"></i>
<span class="font-serif text-2xl font-semibold tracking-wide mt-1 text-gray-900">Vio Vacations</span></a>
</div>
<!-- Book Now Button -->
<div class="hidden md:flex items-center">
<a class="inline-flex items-center px-4 py-2 border border-gray-800 rounded hover:bg-gray-50 transition-colors text-gray-900" href="#">
<span class="mr-2 uppercase text-sm tracking-wider">Book Now</span>
<i class="fa-solid fa-phone text-sm"></i>
</a>
</div>
<!-- Mobile menu button -->
<div class="flex items-center md:hidden">
<button aria-expanded="false" class="text-gray-500 hover:text-gray-700 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-black" type="button">
<span class="sr-only">Open main menu</span>
<i class="fa-solid fa-bars text-xl"></i>
</button>
</div>
</div>
</div>
</header>
<!-- END: Header -->
<!-- BEGIN: Main Content -->
<main>
<!-- BEGIN: Hero Section -->
<section class="relative h-[600px] md:h-[700px] lg:h-[800px] flex items-center justify-center pt-20">
<!-- Background Image -->
<div class="absolute inset-0 w-full h-full">
<img alt="Luxury Home Background" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBZcENiUAenIjGyLWIOLiym5GrVfMx7mDbI4VFjtjJcVIxh_543Pq4iaZx9iTaTs7XZOGdlwMzFoTGzdTEwBlzaxzMBxPuRfMagmJXoFnuHMFoZEvGXPfCCoAoKmEmlNoySSltGz3ylCVdkCcBQ4CqOMNApbJ8ZDC0_eYnCoB_ZoCR-To6l_fYerHoHcuA3txWXne62rn2msh9jVsGAYS2OWJ0x0F7cFOLWDf0BLkHrW0cshQfF5aXLPszMQjeMgDy7EcNo12FrQPU"/>
<!-- Overlay -->
<div class="absolute inset-0 bg-black/10"></div>
</div>
<!-- Search Container -->
<div class="relative z-10 w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 mt-32 md:mt-48 -mb-20">
<div class="bg-white/95 backdrop-blur-md rounded-xl p-4 md:p-6 shadow-[0_10px_30px_rgba(0,0,0,0.1)]">
<form class="flex flex-col md:flex-row gap-4 items-end md:items-center">
  <div class="w-full md:w-1/3 flex flex-col">
    <label class="sr-only" for="destination">Destination</label>
    <div class="relative rounded-md shadow-sm border border-gray-300 bg-white">
      <select class="focus:ring-black focus:border-black block w-full pl-4 pr-10 py-3 sm:text-sm border-gray-300 rounded-md placeholder-gray-500 border-none ring-0 focus:ring-0 appearance-none cursor-pointer" id="property-dropdown" name="destination">
        <option value="" disabled selected>Select a Destination...</option>
        <option value="tenkiller.html">Lake Tenkiller Retreats</option>
        <option value="pcb.html">The Luxury Hilltop</option>
      </select>
      <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
        <i class="fa-solid fa-chevron-down text-gray-400 text-sm"></i>
      </div>
    </div>
  </div>

  <div class="w-full md:w-1/4 flex flex-col opacity-60">
    <label class="sr-only" for="dates">Dates</label>
    <div class="relative rounded-md shadow-sm border border-gray-300 bg-gray-50">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="fa-regular fa-calendar text-gray-400"></i>
      </div>
      <input class="block w-full pl-10 pr-3 py-3 sm:text-sm border-gray-300 rounded-md placeholder-gray-500 border-none ring-0 focus:ring-0 cursor-not-allowed bg-transparent" id="dates" name="dates" placeholder="Dates (Select property)" type="text" disabled/>
    </div>
  </div>

  <div class="w-full md:w-1/4 flex flex-col opacity-60">
    <label class="sr-only" for="guests">Guests</label>
    <div class="relative rounded-md shadow-sm border border-gray-300 bg-gray-50">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="fa-regular fa-user text-gray-400"></i>
      </div>
      <input class="block w-full pl-10 pr-3 py-3 sm:text-sm border-gray-300 rounded-md placeholder-gray-500 border-none ring-0 focus:ring-0 cursor-not-allowed bg-transparent" id="guests" name="guests" placeholder="Guests" type="text" disabled/>
    </div>
  </div>

  <div class="w-full md:w-auto">
    <button onclick="searchProperty()" class="w-full md:w-auto flex items-center justify-center px-8 py-3 border border-gray-800 shadow-sm text-sm font-medium rounded-md text-gray-900 bg-transparent hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 uppercase tracking-wide transition-colors" type="button">
      Check Availability
    </button>
  </div>
</form>
</div>
</div>
</section>
<!-- END: Hero Section -->
<!-- BEGIN: Featured Collections Section -->
<section class="py-16 md:py-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
<div class="text-center mb-12">
<h2 class="text-3xl md:text-4xl font-serif text-gray-900">Featured Collections</h2>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-8">
<!-- Collection Card 1 -->
<div class="group relative rounded-2xl overflow-hidden shadow-lg h-80 md:h-[400px] cursor-pointer">
<img alt="Lake Tenkiller Retreats" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqIfKsqkWtyKPsdRWHB6fsCRn6RKPUQv8KK_KOGZDavgeXAWQx9c4qWyZJPRtLrGewx13mAzK7ZYgkUELHWuhtIahCC11ozFHHagfnEZhZkUqlqaxrLLitFDrEQoE2QAhn--PS_pH1wi4HEpS7rlsJEkovxiSAZRVE7vu0L_ZwwHBhbF83NiD2z9MBGTA9a-kl3L99YF8ErHKbK85m8qwahbz27_9svxNGz_D-Y00tAJm2dVPZ8biVh_ykZVkjA86SPB6ohusw61E"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
<div class="absolute bottom-0 left-0 p-6 md:p-8">
<h3 class="text-2xl font-serif text-white mb-2">Lake Tenkiller Retreats</h3>
<p class="text-gray-200 text-sm md:text-base">Tranquil escapes in the heart of nature.</p>
</div>
</div>
<!-- Collection Card 2 -->
<div class="group relative rounded-2xl overflow-hidden shadow-lg h-80 md:h-[400px] cursor-pointer">
<img alt="PCB Coastal Luxury" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDCROiZ_4WCbMrAPzcoN4y3I_Gh7WbG-EuLf5H2CeULyrQQ4xXVcvvbfXbp-0axyRehmpVYhG54JAbLBzpMG4tsBuut45RRm07t0RaWku5DmhoAX4bAl-m_6mJIk8ArI57KKNiPWnw_nL0fSg45ET0oKGxcCs-i6b1Ta3lLFDV-MfhiO3G3cqDUq2sfbO5Rd-Ng4Uj8nGM0ck7qahTpwx-p7ow1ASapnPUlLol8hu5j-HIYd2ukZBh0mE4cVOO4DYVP7z0fxRBC5b0"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
<div class="absolute bottom-0 left-0 p-6 md:p-8">
<h3 class="text-2xl font-serif text-white mb-2">PCB Coastal Luxury</h3>
<p class="text-gray-200 text-sm md:text-base">Exclusive stays on Panama City Beach.</p>
</div>
</div>
</div>
</section>
<!-- END: Featured Collections Section -->
</main>
<!-- END: Main Content -->
<script>
    function searchProperty() {
      var dropdown = document.getElementById("property-dropdown");
      var selectedPage = dropdown.value;
      if (selectedPage) {
        window.location.href = selectedPage;
      } else {
        alert("Please select a destination from the dropdown first!");
      }
    }
  </script>
</body></html>
